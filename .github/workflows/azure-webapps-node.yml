{
  "name": "azure-node-app",
  "version": "1.0.0",
  "main": "server.js",
  "scripts": {
    "start": "node server.js"
  },
  "dependencies": {
    "express": "^4.19.2"
  }
}
const express = require('express');
const app = express();

// O Azure define automaticamente a porta via variável de ambiente
const PORT = process.env.PORT || 3000;

app.get('/', (req, res) => {
  res.json({
    status: "Sucesso",
    message: "Aplicativo Node.js executando com sucesso no Azure Web App!",
    timestamp: new Date()
  });
});

app.listen(PORT, () => {
  console.log(`Servidor rodando na porta ${PORT}`);
});
